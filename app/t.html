<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Spear Tower Defense - Multiple Paths</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles/core.css">
    <link rel="stylesheet" href="styles/enemy.css">
</head>
<body>
    <div id="error-display"></div>
    
    <div id="game-container">
        <div id="game-board"></div>
        <div id="feedback" class="feedback"></div>
        <div id="sidebar">
            <h2>Ice Spear Tower Defense</h2>
            <div class="button-group">
                <button id="damage10" class="damage-button">ダメージ10</button>
                <button id="damage30" class="damage-button">ダメージ30</button>
                <button id="heal20" class="heal-button">回復20</button>
            </div>
            <div class="button-group">
                <button id="toggleCritical" class="toggle-button">クリティカル状態切替</button>
                <button id="toggleDestroyed" class="destroy-button">破壊状態切替</button>
                <button id="resetHealth" class="toggle-button">リセット</button>
            </div>
            <div id="resources">
                <p>Gold: <span id="gold">500</span></p>
                <p>Mana: <span id="mana">100</span></p>
            </div>
            <div id="tower-buttons">
                <button class="tower-button" data-tower-type="ice">Ice Tower (50g)</button>
                <button class="tower-button" data-tower-type="fire">Fire Tower (100g)</button>
                <button class="tower-button" data-tower-type="stone">Stone Tower (150g)</button>
                <button class="tower-button" data-tower-type="wind">Wind Tower (150g)</button>
            </div>
            <div id="upgrades">
                <button onclick="upgrade('damage')">Upgrade Damage (100g)</button>
                <button onclick="upgrade('range')">Upgrade Range (100g)</button>
                <button onclick="upgrade('speed')">Upgrade Speed (100g)</button>
            </div>
            <button id="synthesis-button">合成</button>
            <div id="synthesis-instruction"></div>
            <p>Wave: <span id="wave">1</span></p>
            <p>Core Health: <span id="core-health">1000</span></p>
            <button id="start-wave" onclick="game.service.waveManager.startWave()" disabled>Start Wave</button>
            <!-- スキル選択システム用のUI -->
            <div id="skill-system">
                <h3>Skills</h3>
                <div id="skill-options"></div>
                <button id="show-skill-selection">Select Skill</button>
            </div>        
        </div>

        <!-- スキル選択モーダル -->
        <div id="skill-selection-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2>スキル選択</h2>
                <div id="skill-selection-options"></div>
                <button id="close-skill-selection">閉じる</button>
            </div>
        </div>

        <!-- 合成モーダル -->
        <div id="synthesis-modal" class="side-modal">
            <h2>合成モード</h2>
            <div id="synthesis-modal-content"></div>
            <button id="confirm-synthesis-modal">合成する</button>
            <button id="cancel-synthesis-modal">合成をキャンセル</button>
        </div>
    </div>

    <script>
        if (window.location.protocol === 'file:') {
            alert('ローカルサーバー(前提: python -m http.server 8000 開発でキャッシュしない場合は python ../utils/server.py 8000)を使用して正しくゲームを起動します。自動的にリダイレクトします。');
            window.location.href = 'http://localhost:8000/t.html';
        }
    </script>

    <script type="module" src="game.js"></script>
    
    <script type="module">
        import { Damage } from './Damage.js';

        document.addEventListener('DOMContentLoaded', () => {
            const gameBoard = document.getElementById('game-board');
            const damage = new Damage(gameBoard);

            // ボタンのイベントリスナーを設定
            document.getElementById('damage10').addEventListener('click', () => {
                const core = document.getElementById('core');
                if (core) {
                    const coreRect = core.getBoundingClientRect();
                    const gameBoardRect = gameBoard.getBoundingClientRect();
                    const x = coreRect.left - gameBoardRect.left + core.offsetWidth / 2 - 30;
                    const y = coreRect.top - gameBoardRect.top + core.offsetHeight / 2;
                    damage.showDamage(x, y, 10);
                    
                    // コアのHPを更新
                    if (window.game && window.game.service) {
                        window.game.service.takeCoreHit(10);
                    }
                }
            });

            document.getElementById('damage30').addEventListener('click', () => {
                const core = document.getElementById('core');
                if (core) {
                    const coreRect = core.getBoundingClientRect();
                    const gameBoardRect = gameBoard.getBoundingClientRect();
                    const x = coreRect.left - gameBoardRect.left + core.offsetWidth / 2 - 30;
                    const y = coreRect.top - gameBoardRect.top + core.offsetHeight / 2;
                    damage.showDamage(x, y, 30);
                    
                    // コアのHPを更新
                    if (window.game && window.game.service) {
                        window.game.service.takeCoreHit(30);
                    }
                }
            });

            document.getElementById('heal20').addEventListener('click', () => {
                const core = document.getElementById('core');
                if (core) {
                    const coreRect = core.getBoundingClientRect();
                    const gameBoardRect = gameBoard.getBoundingClientRect();
                    const x = coreRect.left - gameBoardRect.left + core.offsetWidth / 2 - 30;
                    const y = coreRect.top - gameBoardRect.top + core.offsetHeight / 2;
                    damage.showFloatingText(x, y, 20, 'heal');
                    
                    // コアのHPを回復
                    if (window.game && window.game.service) {
                        window.game.service.coreHealth.heal(20);
                        // 表示を更新
                        const coreHealthDisplay = document.getElementById('core-health');
                        if (coreHealthDisplay) {
                            coreHealthDisplay.textContent = window.game.service.coreHealth.getHealth();
                        }
                    }
                }
            });

            // クリティカル、破壊、リセットボタンのイベントリスナー
            document.getElementById('toggleCritical').addEventListener('click', () => {
                console.log('クリティカル状態切替ボタンがクリックされました');
                if (window.game && window.game.service) {
                    console.log('現在のクリティカル状態:', window.game.service.coreHealth.isCritical());
                    const core = document.getElementById('core');
                    if (core) {
                        if (window.game.service.coreHealth.isCritical()) {
                            core.classList.add('core-health-critical');
                        } else {
                            core.classList.remove('core-health-critical');
                        }
                    }
                }
            });

            document.getElementById('toggleDestroyed').addEventListener('click', () => {
                console.log('破壊状態切替ボタンがクリックされました');
                if (window.game && window.game.service) {
                    console.log('現在の破壊状態:', window.game.service.coreHealth.isDead());
                    const core = document.getElementById('core');
                    if (core) {
                        if (window.game.service.coreHealth.isDead()) {
                            core.classList.add('destroyed');
                        } else {
                            core.classList.remove('destroyed');
                        }
                    }
                }
            });

            document.getElementById('resetHealth').addEventListener('click', () => {
                console.log('リセットボタンがクリックされました');
                if (window.game && window.game.service) {
                    // HPを最大値に戻す
                    window.game.service.coreHealth.currentHealth = window.game.service.coreHealth.getMaxHealth();
                    
                    // 表示を更新
                    const coreHealthDisplay = document.getElementById('core-health');
                    if (coreHealthDisplay) {
                        coreHealthDisplay.textContent = window.game.service.coreHealth.getHealth();
                    }
                    
                    // コアの状態をリセット
                    const core = document.getElementById('core');
                    if (core) {
                        core.classList.remove('core-health-critical', 'destroyed');
                        console.log('コアの状態をリセットしました');
                    }
                }
            });
        });
    </script>
</body>
</html>
