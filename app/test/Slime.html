<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slime Test</title>
    <link rel="stylesheet" href="../styles/enemy.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #2c3e50;
            font-family: Arial, sans-serif;
        }

        .control-panel {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #3498db;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #2980b9;
        }

        .game-area {
            position: relative;
            width: 800px;
            height: 600px;
            background: #34495e;
            border-radius: 8px;
            overflow: hidden;
        }

        .enemy {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            cursor: pointer;
        }

        .enemy-body {
            width: 100%;
            height: 100%;
            background-color: #27ae60;
            border-radius: 50%;
            position: relative;
            transition: transform 0.2s;
        }

        .enemy:hover .enemy-body {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="control-panel">
        <button onclick="normalSlime()">Normal</button>
        <button onclick="burnSlime()">Burn</button>
        <button onclick="killSlime()">Death</button>
        <button onclick="poisonSlime()">Poison</button>
        <button onclick="freezeSlime()">Freeze</button>
        <button onclick="weakenSlime()">Weaken</button>
        <button onclick="damageSlime()">Damage</button>
    </div>

    <div class="game-area" id="gameArea"></div>

    <script type="module">
        import { Slime } from '../models/enemies/Slime.js';

        let slime;

        // グローバルスコープに関数を公開
        window.normalSlime = () => {
            slime.removeAllEffects();
        };

        window.burnSlime = () => {
            slime.applyEffect('burned');
        };

        window.killSlime = () => {
            slime.die();
            // 少し待ってから新しいスライムを生成
            setTimeout(() => {
                initializeSlime();
            }, 1000);
        };

        window.poisonSlime = () => {
            slime.applyEffect('poisoned');
        };

        window.freezeSlime = () => {
            slime.applyEffect('frozen');
        };

        window.weakenSlime = () => {
            slime.applyEffect('weakened');
        };

        window.damageSlime = () => {
            const damage = Math.floor(Math.random() * 30) + 10;
            slime.takeDamage(damage);
        };

        function initializeSlime() {
            // 既存のスライムを削除
            if (slime && slime.element && slime.element.parentElement) {
                slime.element.remove();
            }

            // 新しいスライムを生成
            slime = new Slime();
            
            // 体力バーを追加
            const healthBar = document.createElement('div');
            healthBar.className = 'health-bar';
            healthBar.innerHTML = `
                <div class="health-bar-green" style="width: 100%"></div>
                <div class="health-bar-red" style="width: 0%"></div>
            `;
            slime.element.appendChild(healthBar);

            // ゲームエリアに追加
            const gameArea = document.getElementById('gameArea');
            gameArea.appendChild(slime.element);
        }

        // 初期化
        window.addEventListener('load', initializeSlime);
    </script>
</body>
</html>
