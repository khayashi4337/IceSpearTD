<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slime Test</title>
    <link rel="stylesheet" href="../styles/enemy.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #2c3e50;
            font-family: Arial, sans-serif;
        }

        .control-panel {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #3498db;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #2980b9;
        }

        .game-area {
            position: relative;
            width: 800px;
            height: 600px;
            background: #34495e;
            border-radius: 8px;
            overflow: hidden;
        }

        .enemy {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            cursor: pointer;
        }

        .enemy-body {
            width: 100%;
            height: 100%;
            background-color: #27ae60;
            border-radius: 50%;
            position: relative;
            transition: transform 0.2s;
        }

        .enemy:hover .enemy-body {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="control-panel">
        <button onclick="normalSlime()">Normal</button>
        <button onclick="burnSlime()">Burn</button>
        <button onclick="killSlime()">Death</button>
        <button onclick="poisonSlime()">Poison</button>
        <button onclick="freezeSlime()">Freeze</button>
        <button onclick="weakenSlime()">Weaken</button>
        <button onclick="damageSlime()">Damage</button>
    </div>

    <div class="game-area">
        <div class="enemy" id="slime">
            <div class="enemy-body"></div>
            <div class="health-bar">
                <div class="health-bar-green" style="width: 100%"></div>
                <div class="health-bar-red" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <script>
        const slime = document.getElementById('slime');
        let health = 100;

        function normalSlime() {
            slime.className = 'enemy';
            resetHealth();
        }

        function burnSlime() {
            slime.className = 'enemy burned';
            addStatusIcon('burn', '🔥');
        }

        function killSlime() {
            slime.className = 'enemy dying';
            createSplashEffect();
            setTimeout(() => {
                slime.style.display = 'none';
                setTimeout(() => {
                    slime.style.display = '';
                    normalSlime();
                }, 1000);
            }, 200);
        }

        function poisonSlime() {
            slime.className = 'enemy poisoned';
            addStatusIcon('poison', '☠');
        }

        function freezeSlime() {
            slime.className = 'enemy frozen';
            addStatusIcon('freeze', '❄');
        }

        function weakenSlime() {
            slime.className = 'enemy weakened';
            addStatusIcon('weak', '↓');
        }

        function damageSlime() {
            const damage = Math.floor(Math.random() * 30) + 10;
            health = Math.max(0, health - damage);
            updateHealthBar();
            showDamageNumber(damage);
            slime.classList.add('damaged');
            setTimeout(() => slime.classList.remove('damaged'), 300);

            if (health <= 0) {
                killSlime();
            }
        }

        function resetHealth() {
            health = 100;
            updateHealthBar();
        }

        function updateHealthBar() {
            const greenBar = slime.querySelector('.health-bar-green');
            const redBar = slime.querySelector('.health-bar-red');
            
            greenBar.style.width = health + '%';
            redBar.style.width = (100 - health) + '%';
        }

        function createSplashEffect() {
            const numParticles = 8;
            const colors = ['#27ae60', '#2ecc71', '#229954'];

            for (let i = 0; i < numParticles; i++) {
                const particle = document.createElement('div');
                particle.className = 'splash-particle';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                const angle = (i / numParticles) * Math.PI * 2;
                const distance = 50 + Math.random() * 30;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);

                particle.style.animation = 'splashParticle 0.5s ease-out forwards';

                slime.appendChild(particle);
                setTimeout(() => particle.remove(), 500);
            }

            const ring = document.createElement('div');
            ring.className = 'death-burst-ring';
            ring.style.borderColor = '#27ae60';
            slime.appendChild(ring);
            setTimeout(() => ring.remove(), 500);
        }

        function showDamageNumber(damage) {
            const damageElem = document.createElement('div');
            damageElem.className = 'damage-number';
            damageElem.textContent = damage;
            
            const rect = slime.getBoundingClientRect();
            damageElem.style.left = rect.left + rect.width / 2 + 'px';
            damageElem.style.top = rect.top + 'px';
            
            document.body.appendChild(damageElem);
            setTimeout(() => damageElem.remove(), 1000);
        }

        function addStatusIcon(type, symbol) {
            const existingIcon = slime.querySelector('.status-icon');
            if (existingIcon) {
                existingIcon.remove();
            }

            const icon = document.createElement('div');
            icon.className = `status-icon ${type}`;
            icon.textContent = symbol;
            slime.appendChild(icon);
        }

        // 初期状態を設定
        normalSlime();
    </script>
</body>
</html>
