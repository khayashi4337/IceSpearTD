<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enemy Test</title>
    <link rel="stylesheet" href="../styles/enemy.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #2c3e50;
            font-family: Arial, sans-serif;
        }

        .control-panel {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-panel button {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            background: #3498db;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }

        .control-panel button:hover {
            background: #2980b9;
        }

        .enemy-select {
            padding: 5px;
            border: none;
            border-radius: 3px;
            background: #2ecc71;
            color: white;
            cursor: pointer;
            margin-right: 10px;
        }

        .enemy-select option {
            background: #27ae60;
            color: white;
        }

        .game-area {
            width: 800px;
            height: 600px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .enemy {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .enemy-head {
            width: 14px;
            height: 14px;
            background-color: inherit;
            border-radius: 50%;
            margin-bottom: 2px;
        }

        .enemy-body {
            width: 20px;
            height: 24px;
            border-radius: 50%;
            position: relative;
            transition: all 0.3s ease;
        }

        .enemy:hover .enemy-body {
            transform: scale(1.1);
        }

        /* 敵の種類ごとのスタイル */
        .enemy.goblin .enemy-head {
            background-color: #9b59b6;
        }
        .enemy.goblin .enemy-body {
            background-color: #8e44ad;
        }

        .enemy.orc .enemy-head {
            background-color: #e74c3c;
        }
        .enemy.orc .enemy-body {
            background-color: #c0392b;
        }

        .enemy.skeleton .enemy-head {
            background-color: #ecf0f1;
        }
        .enemy.skeleton .enemy-body {
            background-color: #bdc3c7;
        }

        .enemy.slime .enemy-body {
            width: 30px;
            height: 30px;
            background-color: #27ae60;
        }
    </style>
</head>
<body>
    <div class="control-panel">
        <select id="enemySelect" class="enemy-select" onchange="changeEnemy()">
            <option value="slime">Slime</option>
            <option value="goblin">Goblin</option>
            <option value="orc">Orc</option>
            <option value="skeleton">Skeleton</option>
        </select>
        <button onclick="normalEnemy()">Normal</button>
        <button onclick="burnEnemy()">Burn</button>
        <button onclick="killEnemy()">Death</button>
        <button onclick="poisonEnemy()">Poison</button>
        <button onclick="freezeEnemy()">Freeze</button>
        <button onclick="weakenEnemy()">Weaken</button>
        <button onclick="damageEnemy()">Damage</button>
    </div>

    <div class="game-area" id="gameArea"></div>

    <script type="module">
        import { EnemyFactory } from '../models/enemies/EnemyFactory.js';
        import { gameConfig } from '../config/gameConfig.js';

        let enemy;

        // テスト用のダミーパス
        const dummyPath = [
            { x: 0, y: 0 }  // 中央に表示するための位置
        ];

        // グローバルスコープに関数を公開
        window.changeEnemy = () => {
            const type = document.getElementById('enemySelect').value;
            initializeEnemy(type);
        };

        window.normalEnemy = () => {
            enemy.removeAllEffects();
        };

        window.burnEnemy = () => {
            enemy.applyEffect('burned');
        };

        window.killEnemy = () => {
            enemy.die();
            // 少し待ってから新しい敵を生成
            setTimeout(() => {
                const type = document.getElementById('enemySelect').value;
                initializeEnemy(type);
            }, 1000);
        };

        window.poisonEnemy = () => {
            enemy.applyEffect('poisoned');
        };

        window.freezeEnemy = () => {
            enemy.applyEffect('frozen');
        };

        window.weakenEnemy = () => {
            enemy.applyEffect('weakened');
        };

        window.damageEnemy = () => {
            const damage = Math.floor(Math.random() * 30) + 10;
            enemy.takeDamage(damage);
        };

        function initializeEnemy(type = 'slime') {
            // 既存の敵を削除
            if (enemy && enemy.element && enemy.element.parentElement) {
                enemy.element.remove();
            }

            // 新しい敵を生成
            const enemyElement = document.createElement('div');
            enemyElement.className = `enemy ${type}`;
            const gameArea = document.getElementById('gameArea');
            gameArea.appendChild(enemyElement);

            // 敵オブジェクトを作成
            enemy = EnemyFactory.createEnemy(type, enemyElement, dummyPath);

            // 中央に配置
            enemyElement.style.top = '50%';
            enemyElement.style.left = '50%';
        }

        // 初期化
        window.addEventListener('load', () => {
            // gameConfigの初期化（必要な値のみ）
            if (!window.gameConfig) {
                window.gameConfig = {
                    grid: {
                        cellSize: 20
                    }
                };
            }
            initializeEnemy('slime');
        });
    </script>
</body>
</html>
