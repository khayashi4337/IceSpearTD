<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Effect Test</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../styles/core.css">
</head>
<body>
    <div class="test-container">
        <h1>Core Effect Test</h1>
        
        <div id="core-container">
            <div id="health-display">HP: 100/100</div>
            <div id="core"></div>
        </div>

        <div class="control-panel">
            <div class="button-group">
                <button id="damage10" class="damage-button">ダメージ10</button>
                <button id="damage30" class="damage-button">ダメージ30</button>
                <button id="heal20" class="heal-button">回復20</button>
            </div>
            <div class="button-group">
                <button id="toggleCritical" class="toggle-button">クリティカル状態切替</button>
                <button id="toggleDestroyed" class="destroy-button">破壊状態切替</button>
                <button id="resetHealth" class="toggle-button">リセット</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { Core } from './core.js';

        const coreElement = document.getElementById('core');
        const coreContainer = document.getElementById('core-container');
        const healthDisplay = document.getElementById('health-display');

        // Coreクラスのインスタンスを作成
        const core = new Core(coreElement, coreContainer, healthDisplay);

        // ボタンのイベントリスナーを設定
        document.getElementById('damage10').addEventListener('click', () => core.takeDamage(10));
        document.getElementById('damage30').addEventListener('click', () => core.takeDamage(30));
        document.getElementById('heal20').addEventListener('click', () => core.heal(20));
        document.getElementById('toggleCritical').addEventListener('click', () => core.toggleCritical());
        document.getElementById('toggleDestroyed').addEventListener('click', () => core.toggleDestroyed());
        document.getElementById('resetHealth').addEventListener('click', () => core.resetHealth());
    </script>
</body>
</html>
